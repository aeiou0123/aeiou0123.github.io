    Research Experience:
      - title: Adaptive Adjustment of Higher Education Majors Under LLM Shocks
        authors:
          - Research Training (Advised by Prof. Xiaodong Chen and Prof. Xiaoliang Yang) · Principal Investigator
        date: 2026.02 -- Present
        summary: Extended the Acemoglu & Restrepo (2018) task framework to higher education supply; constructed an occupational LLM exposure crosswalk for 889 undergraduate majors. Evaluated causal impacts using Continuous DID, Causal Forests, and trend-adjusted sensitivity tests on 4.34 million enrollment records.

      - title: "Claim2Value: Financial AI Agent for Technical Claim Verification and Dynamic Valuation"
        authors:
          - PKU Financial AI Agent Competition · Project Lead
        date: 2026.08 -- 2026.09
        summary: Built an end-to-end agent pipeline for 11 core listed firms in humanoid robotics/embodied AI. Benchmarked 51 technical claims, modeling transmission mechanisms from technical specifications to productivity, pricing, and margin structures within three-scenario dynamic valuation models.

      - title: Perceived Age Discrimination, Psychological Coping, and Policy Demands of Job Seekers Aged 35+
        authors:
          - National "Challenge Cup" Academic Competition · Core Researcher
        date: 2025.12 -- 2026.04
        summary: Cleaned primary survey microdata, extracted behavioral coping archetypes via Principal Component Analysis (PCA), and utilized quantile regressions to test asymmetric penalties across wage distributions.

      - title: Heterogeneous Energy Price Pass-Through Across Consumption Structures Under Geopolitical Shocks
        authors:
          - Undergraduate Innovation Research Program · Core Researcher
        date: 2026.04 -- Present
        summary: Compiled cross-country macroeconomic time-series panels to evaluate supply-side pass-through elasticities under international supply shocks.

