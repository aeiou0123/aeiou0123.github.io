[[items]]
title = "Adaptive Adjustment of Higher Education Majors Under LLM Shocks"
subtitle = "Working Paper / Research Training (Advisor: Prof. Xiaodong Chen, Prof. Xiaoliang Yang)"
date = "2026.02 – Present"
tags = ["LLM Exposure", "Continuous DID", "Higher Education Supply", "Causal Forest"]
content = """
* **Framework**: Extends the Acemoglu & Restrepo (2018) task framework to the higher education supply side, creating a fine-grained crosswalk mapping 101 occupational LLM exposures to 889 undergraduate majors.
* **Empirical Strategy**: Integrates national major filings (2015–2024) with provincial micro admission records of 4.34 million students across 27 provinces.
* **Methodology**: Employs Continuous Difference-in-Differences (Continuous DID), Causal Forests for heterogeneous treatment effects, and trend-adjusted sensitivity analyses.
"""

[[items]]
title = "Firm Decision-Making and Market Structure Under Token and AI Agent Shocks"
subtitle = "Working Paper / Independent Research"
date = "2026"
tags = ["Industrial Organization", "AI Agents", "Oligopoly", "Market Concentration"]
content = """
* **Theory**: Abstracting Tokens and AI Agents as on-demand heterogeneous production inputs, restructuring firm-level marginal and fixed cost curves.
* **Market Dynamics**: Investigates concentration dynamics, price pass-through, and consumer surplus under Cournot and Bertrand oligopolies with endogenous entry/exit barriers and matching frictions.
"""

