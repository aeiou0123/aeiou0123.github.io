[[items]]
title = "Adaptive Adjustment of Higher Education Majors Under LLM Shocks"
subtitle = "Working Paper (Advised by Prof. Xiaodong Chen & Prof. Xiaoliang Yang)"
date = "2026.02 – Present"
tags = ["LLM Exposure", "Continuous DID", "Higher Education Supply", "Causal Forest"]
content = """
* **Framework**: Extends the Acemoglu & Restrepo (2018) task framework to higher education supply, mapping occupational LLM exposure to undergraduate majors.
* **Empirical Strategy**: Combines national major filings (2015–2024) with provincial admission records of 4.34 million students across 27 provinces.
* **Methods**: Employs continuous difference-in-differences, causal forests for heterogeneous treatment effects, and trend-adjusted sensitivity analyses.
"""

[[items]]
title = "Firm Decision-Making and Market Structure Under Token and AI Agent Shocks"
subtitle = "Working Paper / Independent Research"
date = "2026"
tags = ["Industrial Organization", "AI Agents", "Oligopoly", "Market Concentration"]
content = """
* **Model**: Models Tokens and AI Agents as on-demand production inputs, altering firm cost functions.
* **Analysis**: Examines market concentration, pricing, and consumer surplus under Cournot and Bertrand competition with entry/exit and search frictions.
* **Paper**: [📄 Read Working Paper (PDF)](/files/Intermediate%20Microeconomics/agent-token-micro-paper.pdf)
"""

