title = "Token 与 AI Agent 冲击下的企业决策与市场结构：成本重组、竞争传导与福利分析"
subtitle = "工作论文 / 独立研究"
date = "2026"
tags = ["产业组织理论", "AI Agent", "寡头博弈", "市场集中度"]
content = """
* **模型机制**：将 Token 与 AI Agent 抽象为企业可按需调用的异质性生产要素，重构企业微观边际与固定成本函数。
* **竞争分析**：在 Cournot 与 Bertrand 寡头博弈、进入退出摩擦与搜索摩擦下，严谨推导市场集中度、竞争格局演化与消费者福利动态。
