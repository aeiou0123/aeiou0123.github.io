[[items]]
title = "大语言模型冲击下高校本科专业结构的适应性调整"
subtitle = "工作论文（指导教师：陈晓东老师、杨晓亮老师） · 项目负责人"
date = "2026.02 – 至今"
tags = ["LLM 暴露度", "连续 DID", "高等教育供给", "因果森林"]
content = """
* **理论拓展**：将 Acemoglu & Restrepo (2018) 任务模型拓展至高校供给侧，构建 101 个职业大模型暴露度到 889 个本科专业的映射。
* **数据基础**：整合 2015–2024 年全国专业备案与 27 个省份 434 万条招生微观面板数据。
* **计量方法**：运用连续双重差分（Continuous DID）、因果森林及去趋势稳健性检验，评估因果冲击与异质性调整。
"""

[[items]]
title = "Token 与 AI Agent 冲击下的企业决策与市场结构"
subtitle = "工作论文 / 独立研究"
date = "2026"
tags = ["产业组织理论", "AI Agent", "寡头博弈", "市场集中度"]
content = """
* **理论机制**：将 Token 与 AI Agent 抽象为可按需调用的异质性要素，分析其对企业边际与固定成本函数的影响。
* **竞争分析**：在 Cournot 与 Bertrand 寡头博弈、进入退出摩擦与搜索摩擦下，推导市场集中度与消费者福利变动。
* **论文全文**：[📄 阅读论文全文（PDF）](/files/Intermediate%20Microeconomics/agent-token-micro-paper.pdf)
"""

