[[items]]
title = "大语言模型冲击下高校本科专业结构的适应性调整——理论建模、LLM 暴露度测度与连续双重差分实证"
subtitle = "科研训练（合作指导：陈晓东、杨晓亮老师） · 项目负责人"
date = "2026.02 – 至今"
tags = ["LLM 暴露度", "连续 DID", "高等教育供给", "因果森林"]
content = """
* **理论拓展**：将 Acemoglu & Restrepo (2018) 任务模型拓展至高教供给侧，构建 101 职业大模型暴露度 → 889 本科专业 Crosswalk 映射。
* **数据基础**：整合 2015–2024 全国专业备案与 27 省 434 万条招生微观面板数据。
* **计量方法**：运用连续双重差分（Continuous DID）、因果森林（Causal Forest）及去趋势稳健性检验，评估因果冲击与异质性调整。
"""

